<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thamizhil Deutsch — Learn German in Tamil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1420;
    --bg2:#241A2E;
    --card:#2C2038;
    --cream:#F6ECD9;
    --cream-dim:#CFC3AE;
    --red:#C1453F;
    --red-dim:#8A3230;
    --gold:#E4A83B;
    --teal:#2E9B82;
    --indigo:#7B8AE8;
    --wrong:#D9534F;
    --line: rgba(246,236,217,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Work Sans', 'Noto Sans Tamil', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .ta{font-family:'Noto Sans Tamil','Work Sans',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces','Noto Sans Tamil',serif;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;}
  #app{max-width:920px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- NAV ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px 10px;max-width:920px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;letter-spacing:.2px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block;}
  .brand small{display:block;font-family:'Space Mono',monospace;font-size:.6rem;color:var(--cream-dim);letter-spacing:1.5px;font-weight:400;text-transform:uppercase;margin-top:2px;}

  /* ---------- HERO ---------- */
  .hero{padding:64px 0 40px;text-align:center;}
  .eyebrow{
    font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--gold);margin-bottom:18px;
  }
  .hero h1{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.08;margin:0 0 26px;font-weight:600;}
  .hero h1 .accent{color:var(--red);font-style:italic;}

  /* split-flap board */
  .flapboard{
    display:inline-flex;gap:10px;align-items:stretch;margin:0 auto 30px;
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 26px;
  }
  .flap-col{display:flex;flex-direction:column;align-items:center;min-width:110px;}
  .flap-lang{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--cream-dim);margin-bottom:8px;text-transform:uppercase;}
  .flap-word{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;min-height:1.4em;
    transition:opacity .25s ease, transform .25s ease;
  }
  .flap-word.ta{font-size:1.35rem;}
  .flap-fade{opacity:0;transform:translateY(6px);}
  .flap-div{width:1px;background:var(--line);margin:4px 0;}

  .hero-sub{color:var(--cream-dim);font-size:1.02rem;max-width:480px;margin:0 auto 34px;line-height:1.6;}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    padding:14px 30px;border-radius:100px;font-weight:600;font-size:.98rem;
    transition:transform .15s ease, box-shadow .15s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:var(--cream);box-shadow:0 6px 20px rgba(193,69,63,.35);}
  .btn-primary:hover{box-shadow:0 8px 26px rgba(193,69,63,.5);}
  .btn-ghost{background:transparent;color:var(--cream);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--cream-dim);}

  .stats{display:flex;gap:38px;justify-content:center;margin-top:56px;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:1.9rem;color:var(--gold);}
  .stat span{font-size:.78rem;color:var(--cream-dim);letter-spacing:.4px;}

  /* ---------- SECTION HEADERS ---------- */
  .section-head{margin:70px 0 26px;text-align:center;}
  .section-head h2{font-size:1.7rem;margin:0 0 8px;}
  .section-head p{color:var(--cream-dim);font-size:.94rem;margin:0;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;color:var(--cream-dim);font-size:.88rem;
    margin-bottom:22px;background:none;padding:0;
  }
  .back-btn:hover{color:var(--cream);}

  /* ---------- LEVEL STAIRCASE ---------- */
  .staircase{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
  .level-card{
    display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px 22px;text-align:left;transition:transform .15s ease, border-color .15s ease;
    width:100%;
  }
  .level-card:hover{transform:translateX(6px);border-color:var(--gold);}
  .level-code{
    font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;background:var(--bg2);
    color:var(--gold);padding:10px 14px;border-radius:10px;min-width:64px;text-align:center;
  }
  .level-info{flex:1;}
  .level-info h3{margin:0 0 4px;font-size:1.1rem;}
  .level-info span{font-size:.82rem;color:var(--cream-dim);}
  .level-progress{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--teal);}
  /* stagger indent to feel like a staircase rising */
  .staircase .level-card:nth-child(1){margin-left:0;}
  .staircase .level-card:nth-child(2){margin-left:10px;}
  .staircase .level-card:nth-child(3){margin-left:20px;}
  .staircase .level-card:nth-child(4){margin-left:30px;}
  .staircase .level-card:nth-child(5){margin-left:40px;}
  .staircase .level-card:nth-child(6){margin-left:50px;}
  .staircase .level-card:nth-child(7){margin-left:60px;}
  .staircase .level-card:nth-child(8){margin-left:70px;}
  @media(max-width:600px){
    .staircase .level-card{margin-left:0 !important;}
  }

  /* ---------- TOPICS ---------- */
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .topic-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:left;
    transition:transform .15s ease,border-color .15s ease;
  }
  .topic-card:hover{transform:translateY(-3px);border-color:var(--teal);}
  .topic-card h3{margin:0 0 6px;font-size:1.02rem;}
  .topic-card span{font-size:.8rem;color:var(--cream-dim);}

  /* ---------- PRACTICE ---------- */
  .practice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:14px;}
  .progress-track{flex:1;height:8px;background:var(--bg2);border-radius:100px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:100px;transition:width .35s ease;}
  .streak-pill{
    display:flex;align-items:center;gap:5px;background:var(--bg2);padding:6px 12px;border-radius:100px;
    font-family:'Space Mono',monospace;font-size:.8rem;color:var(--gold);white-space:nowrap;
  }

  .flashcard{
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:44px 30px;
    text-align:center;margin-bottom:26px;position:relative;overflow:hidden;
  }
  .card-tag{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--cream-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;}
  .card-ta{font-size:1.9rem;margin:0 0 6px;font-weight:600;}
  .card-en{color:var(--cream-dim);font-size:.95rem;margin-bottom:6px;}
  .prompt-line{font-size:1.02rem;color:var(--cream-dim);margin-top:18px;}

  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.options-grid{grid-template-columns:1fr;}}
  .opt-btn{
    background:var(--bg2);border:1.5px solid var(--line);color:var(--cream);border-radius:14px;
    padding:16px;font-size:1.05rem;font-weight:600;transition:all .15s ease;text-align:center;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--gold);}
  .opt-btn.correct{background:rgba(46,155,130,.18);border-color:var(--teal);color:var(--teal);}
  .opt-btn.wrong{background:rgba(217,83,79,.18);border-color:var(--wrong);color:var(--wrong);animation:shake .35s ease;}
  .opt-btn:disabled{cursor:default;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .feedback-banner{
    text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:18px;padding:12px;border-radius:12px;
    opacity:0;transform:translateY(-6px);transition:all .25s ease;
  }
  .feedback-banner.show{opacity:1;transform:translateY(0);}
  .feedback-banner.correct{background:rgba(46,155,130,.15);color:var(--teal);}
  .feedback-banner.wrong{background:rgba(217,83,79,.15);color:var(--wrong);}

  .next-row{text-align:center;margin-top:20px;}

  /* ---------- SUMMARY ---------- */
  .summary-card{text-align:center;padding:60px 20px;}
  .summary-emoji{font-size:3.4rem;margin-bottom:10px;}
  .summary-card h2{font-size:2rem;margin:0 0 10px;}
  .summary-score{font-family:'Space Mono',monospace;font-size:1.3rem;color:var(--gold);margin-bottom:30px;}

  /* confetti */
  .confetti{position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:999;}

  footer{text-align:center;color:var(--cream-dim);font-size:.8rem;margin-top:80px;padding-top:30px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>Thamizhil Deutsch
      <small>தமிழில் Deutsch · Learn German in Tamil</small>

  </div>
</div>
<div id="app"></div>

"தீமை", "en": "disadvantage", "ex": "Es gibt auch Nachteile."}, {"id": "b2.2-op-8", "de": "die Perspektive", "ta": "பார்வை", "en": "perspective", "ex": "Das ist eine interessante Perspektive."}, {"id": "b2.2-op-9", "de": "objektiv", "ta": "நடுநிலையான", "en": "objective", "ex": "Bitte bleib objektiv."}, {"id": "b2.2-op-10", "de": "subjektiv", "ta": "அகநிலையான", "en": "subjective", "ex": "Das ist eine subjektive Meinung."}, {"id": "b2.2-op-11", "de": "überzeugen", "ta": "சம்மதிக்க வைக்க", "en": "to convince", "ex": "Er hat mich überzeugt."}, {"id": "b2.2-op-12", "de": "die Kontroverse", "ta": "சர்ச்சை", "en": "controversy", "ex": "Das Thema ist eine Kontroverse."}, {"id": "b2.2-op-13", "de": "differenzieren", "ta": "வேறுபடுத்திப் பார்க்க", "en": "to differentiate", "ex": "Man muss hier differenzieren."}, {"id": "b2.2-op-14", "de": "die Konsequenz", "ta": "விளைவு", "en": "consequence", "ex": "Das hat ernste Konsequenzen."}, {"id": "b2.2-op-15", "de": "berücksichtigen", "ta": "கருத்தில் கொள்ள", "en": "to take into account", "ex": "Wir müssen alle Faktoren berücksichtigen."}]}, "media_literacy": {"label": "Vocabulary: Media Literacy & Critical Reading", "items": [{"id": "b2.2-lit-1", "de": "die Fehlinformation", "ta": "தவறான தகவல்", "en": "misinformation", "ex": "Fehlinformationen verbreiten sich schnell."}, {"id": "b2.2-lit-2", "de": "glaubwürdig", "ta": "நம்பகமான", "en": "credible", "ex": "Ist diese Quelle glaubwürdig?"}, {"id": "b2.2-lit-3", "de": "hinterfragen", "ta": "கேள்வி எழுப்ப", "en": "to question/scrutinize", "ex": "Man sollte alles hinterfragen."}, {"id": "b2.2-lit-4", "de": "die Voreingenommenheit", "ta": "சார்பு நிலை", "en": "bias", "ex": "Jeder Mensch hat gewisse Voreingenommenheiten."}, {"id": "b2.2-lit-5", "de": "die Manipulation", "ta": "கையாளுதல்", "en": "manipulation", "ex": "Das ist reine Manipulation."}, {"id": "b2.2-lit-6", "de": "die Tatsache", "ta": "உண்மை", "en": "fact", "ex": "Das ist eine wissenschaftliche Tatsache."}, {"id": "b2.2-lit-7", "de": "die Behauptung", "ta": "கூற்று", "en": "claim/assertion", "ex": "Diese Behauptung ist nicht bewiesen."}, {"id": "b2.2-lit-8", "de": "überprüfen", "ta": "சரிபார்க்க", "en": "to verify/check", "ex": "Ich überprüfe die Fakten."}, {"id": "b2.2-lit-9", "de": "der Kontext", "ta": "சூழல்", "en": "context", "ex": "Man muss den Kontext verstehen."}, {"id": "b2.2-lit-10", "de": "die Interpretation", "ta": "விளக்கம்", "en": "interpretation", "ex": "Es gibt verschiedene Interpretationen."}, {"id": "b2.2-lit-11", "de": "kritisch denken", "ta": "விமர்சன ரீதியாக சிந்திக்க", "en": "to think critically", "ex": "Wir sollten kritisch denken."}, {"id": "b2.2-lit-12", "de": "die Propaganda", "ta": "பிரச்சாரம்", "en": "propaganda", "ex": "Das war reine Propaganda."}, {"id": "b2.2-lit-13", "de": "die Perspektivenvielfalt", "ta": "பல்வேறு பார்வைகள்", "en": "diversity of perspectives", "ex": "Perspektivenvielfalt bereichert die Diskussion."}, {"id": "b2.2-lit-14", "de": "die Verzerrung", "ta": "திரிபு", "en": "distortion", "ex": "Diese Darstellung ist eine Verzerrung."}, {"id": "b2.2-lit-15", "de": "einordnen", "ta": "வகைப்படுத்த", "en": "to classify/put into context", "ex": "Man muss die Information richtig einordnen."}]}}}};

const LEVEL_ORDER = ["A1.1","A1.2","A2.1","A2.2","B1.1","B1.2","B2.1","B2.2"];

/* words used in the hero split-flap cycler */
const FEATURED = [
  {de:"Hallo", ta:"வணக்கம்", en:"hello"},
  {de:"Familie", ta:"குடும்பம்", en:"family"},
  {de:"lernen", ta:"கற்க", en:"to learn"},
  {de:"Zukunft", ta:"எதிர்காலம்", en:"future"},
  {de:"Freundschaft", ta:"நட்பு", en:"friendship"},
];

/* ============ STATE ============ */
let state = { screen:"landing", level:null, topicKey:null, qIndex:0, score:0, options:[], locked:false, streak:0 };

function totalWords(){
  let n=0;
  for(const lvl of LEVEL_ORDER){
    for(const tk in DATA[lvl].topics) n += DATA[lvl].topics[tk].items.length;
  }
  return n;
}

/* ============ STORAGE ============ */
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem("td_progress")||"{}"); }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem("td_progress", JSON.stringify(p)); }
function loadStreak(){
  try{ return JSON.parse(localStorage.getItem("td_streak")||'{"count":0,"last":null}'); }catch(e){ return {count:0,last:null}; }
}
function bumpStreak(){
  const s = loadStreak();
  const today = new Date().toDateString();
  if(s.last === today) return s.count;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  s.count = (s.last === yesterday) ? s.count+1 : 1;
  s.last = today;
  localStorage.setItem("td_streak", JSON.stringify(s));
  return s.count;
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById("app");
  if(state.screen==="landing") app.innerHTML = renderLanding();
  else if(state.screen==="levels") app.innerHTML = renderLevels();
  else if(state.screen==="topics") app.innerHTML = renderTopics();
  else if(state.screen==="practice") app.innerHTML = renderPractice();
  else if(state.screen==="summary") app.innerHTML = renderSummary();
  attachHandlers();
  if(state.screen==="landing") startFlap();
}

/* ============ LANDING ============ */
function renderLanding(){
  const words = totalWords();
  return `
  <section class="hero">
    <div class="eyebrow">Free · No signup needed</div>
    <h1>Learn <span class="accent">German</span><br/>the way your Tamil<br/>brain already thinks.</h1>
    <div class="flapboard" id="flapboard">
      <div class="flap-col"><div class="flap-lang">Deutsch</div><div class="flap-word" id="flap-de">Hallo</div></div>
      <div class="flap-div"></div>
      <div class="flap-col"><div class="flap-lang">தமிழ்</div><div class="flap-word ta" id="flap-ta">வணக்கம்</div></div>
      <div class="flap-div"></div>
      <div class="flap-col"><div class="flap-lang">English</div><div class="flap-word" id="flap-en">hello</div></div>
    </div>
    <p class="hero-sub">No English detour. Every word explained straight from Tamil to German — with pictures, quizzes, and a little bit of fun.</p>
    <div class="cta-row">
      <button class="btn btn-primary" data-nav="levels">Start learning →</button>
      <a class="btn btn-ghost" href="https://t.me/ThamizhilDeutschBot" target="_blank">Try the Telegram bot</a>
    </div>
    <div class="stats">
      <div class="stat"><b>${words}+</b><span>words</span></div>
      <div class="stat"><b>8</b><span>levels · A1 to B2</span></div>
      <div class="stat"><b>0€</b><span>to start</span></div>
    </div>
  </section>
  <footer>தமிழில் Deutsch · Built by Shilpa Vellore Krishnamurthy</footer>
  `;
}

let flapTimer=null;
function startFlap(){
  if(flapTimer) clearInterval(flapTimer);
  let i=0;
  const deEl=document.getElementById("flap-de"), taEl=document.getElementById("flap-ta"), enEl=document.getElementById("flap-en");
  if(!deEl) return;
  flapTimer = setInterval(()=>{
    i=(i+1)%FEATURED.length;
    [deEl,taEl,enEl].forEach(el=>el.classList.add("flap-fade"));
    setTimeout(()=>{
      deEl.textContent = FEATURED[i].de;
      taEl.textContent = FEATURED[i].ta;
      enEl.textContent = FEATURED[i].en;
      [deEl,taEl,enEl].forEach(el=>el.classList.remove("flap-fade"));
    },250);
  },2400);
}

/* ============ LEVELS ============ */
function renderLevels(){
  const progress = loadProgress();
  const rows = LEVEL_ORDER.map(lvl=>{
    const topics = DATA[lvl].topics;
    const topicCount = Object.keys(topics).length;
    const wordCount = Object.values(topics).reduce((a,t)=>a+t.items.length,0);
    const done = progress[lvl] ? Object.keys(progress[lvl]).length : 0;
    return `
    <button class="level-card" data-level="${lvl}">
      <div class="level-code">${lvl}</div>
      <div class="level-info">
        <h3>${DATA[lvl].label}</h3>
        <span>${topicCount} topics · ${wordCount} words</span>
      </div>
      <div class="level-progress">${done}/${topicCount} done</div>
    </button>`;
  }).join("");
  return `
  <button class="back-btn" data-nav="landing">← Home</button>
  <div class="section-head"><h2>Pick your level</h2><p>Climb from your first "Hallo" to real debates.</p></div>
  <div class="staircase">${rows}</div>
  `;
}

/* ============ TOPICS ============ */
function renderTopics(){
  const lvl = state.level;
  const topics = DATA[lvl].topics;
  const progress = loadProgress();
  const cards = Object.keys(topics).map(tk=>{
    const t = topics[tk];
    const best = progress[lvl] && progress[lvl][tk] ? progress[lvl][tk] : null;
    return `
    <button class="topic-card" data-topic="${tk}">
      <h3>${t.label.replace(/^Vocabulary: /,"")}</h3>
      <span>${t.items.length} words${best? " · best "+best+"%":""}</span>
    </button>`;
  }).join("");
  return `
  <button class="back-btn" data-nav="levels">← Levels</button>
  <div class="section-head"><h2>${lvl} — ${DATA[lvl].label}</h2><p>Choose a topic to practice.</p></div>
  <div class="topic-grid">${cards}</div>
  `;
}

/* ============ PRACTICE ============ */
function buildQuestion(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const correct = items[state.qIndex];
  let pool = items.filter(it=>it.id!==correct.id).slice();
  pool.sort(()=>Math.random()-0.5);
  const distractors = pool.slice(0,3);
  const options = [correct,...distractors].sort(()=>Math.random()-0.5);
  state.options = options;
  state.locked = false;
}

function renderPractice(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  if(state.qIndex===0 && state.options.length===0) buildQuestion();
  const current = items[state.qIndex];
  const pct = Math.round((state.qIndex)/items.length*100);
  const streak = loadStreak().count;

  const optsHtml = state.options.map(opt=>{
    return `<button class="opt-btn" data-optid="${opt.id}">${opt.de}</button>`;
  }).join("");

  return `
  <button class="back-btn" data-nav="topics">← Exit topic</button>
  <div class="practice-header">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="streak-pill">🔥 ${streak}</div>
  </div>
  <div id="feedback" class="feedback-banner"></div>
  <div class="flashcard">
    <div class="card-tag">${topic.label}</div>
    <div class="card-ta ta">${current.ta}</div>
    <div class="card-en">${current.en||""}</div>
    <div class="prompt-line">Which German word matches this?</div>
  </div>
  <div class="options-grid">${optsHtml}</div>
  <div class="next-row" id="nextRow"></div>
  `;
}

/* ============ SUMMARY ============ */
function renderSummary(){
  const topic = DATA[state.level].topics[state.topicKey];
  const total = topic.items.length;
  const pct = Math.round((state.score/total)*100);
  const emoji = pct>=80 ? "🎉" : pct>=50 ? "🌟" : "💪";
  const msg = pct>=80 ? "Super da! Excellent work." : pct>=50 ? "Nalla progress! Keep going." : "Konjo practice pannunga — you'll get there.";

  const progress = loadProgress();
  if(!progress[state.level]) progress[state.level] = {};
  const prevBest = progress[state.level][state.topicKey] || 0;
  progress[state.level][state.topicKey] = Math.max(prevBest, pct);
  saveProgress(progress);

  return `
  <div class="flashcard summary-card">
    <div class="summary-emoji">${emoji}</div>
    <h2>${msg}</h2>
    <div class="summary-score mono">${state.score} / ${total} correct — ${pct}%</div>
    <div class="cta-row">
      <button class="btn btn-primary" data-action="retry">Try again</button>
      <button class="btn btn-ghost" data-nav="topics">Other topics</button>
    </div>
  </div>
  `;
}

/* ============ CONFETTI ============ */
function burstConfetti(){
  const colors=["#E4A83B","#C1453F","#2E9B82","#7B8AE8"];
  const supportsAnimate = typeof Element!=="undefined" && typeof Element.prototype.animate==="function";
  for(let i=0;i<24;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left = (45+Math.random()*10)+"vw";
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d);
    const dx=(Math.random()-0.5)*300, dur=700+Math.random()*500;
    if(supportsAnimate){
      try{
        d.animate([
          {transform:`translate(0,0) rotate(0deg)`, opacity:1},
          {transform:`translate(${dx}px, 70vh) rotate(720deg)`, opacity:0}
        ],{duration:dur, easing:"cubic-bezier(.2,.6,.3,1)"});
      }catch(e){ /* animation unsupported in this environment, confetti just won't move */ }
    }else{
      /* fallback: simple CSS transition instead of the Web Animations API */
      d.style.transition = `transform ${dur}ms cubic-bezier(.2,.6,.3,1), opacity ${dur}ms ease`;
      requestAnimationFrame(()=>{
        d.style.transform = `translate(${dx}px, 70vh) rotate(720deg)`;
        d.style.opacity = "0";
      });
    }
    setTimeout(()=>d.remove(), dur+50);
  }
}

/* ============ EVENTS ============ */
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = ()=>{
      const nav = el.getAttribute("data-nav");
      if(nav==="topics") state.screen="topics";
      else if(nav==="levels"){ state.screen="levels"; }
      else if(nav==="landing"){ state.screen="landing"; }
      render();
    };
  });
  document.querySelectorAll("[data-level]").forEach(el=>{
    el.onclick = ()=>{ state.level=el.getAttribute("data-level"); state.screen="topics"; render(); };
  });
  document.querySelectorAll("[data-topic]").forEach(el=>{
    el.onclick = ()=>{
      state.topicKey = el.getAttribute("data-topic");
      state.qIndex=0; state.score=0; state.options=[];
      state.screen="practice"; render();
    };
  });
  document.querySelectorAll("[data-optid]").forEach(el=>{
    el.onclick = ()=>handleAnswer(el);
  });
  const retryBtn = document.querySelector('[data-action="retry"]');
  if(retryBtn) retryBtn.onclick = ()=>{ state.qIndex=0; state.score=0; state.options=[]; state.screen="practice"; render(); };
}

function handleAnswer(btnEl){
  if(state.locked) return;
  state.locked = true;
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const current = items[state.qIndex];
  const chosenId = btnEl.getAttribute("data-optid");
  const isCorrect = chosenId === current.id;
  const feedback = document.getElementById("feedback");

  document.querySelectorAll(".opt-btn").forEach(b=>{
    b.disabled = true;
    if(b.getAttribute("data-optid")===current.id) b.classList.add("correct");
    if(b===btnEl && !isCorrect) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    bumpStreak();
    feedback.textContent = "🟩 Correct-u! Super da";
    feedback.className = "feedback-banner correct show";
    burstConfetti();
  }else{
    feedback.textContent = `🟥 Wrong-u. Correct word: ${current.de}`;
    feedback.className = "feedback-banner wrong show";
  }

  const nextRow = document.getElementById("nextRow");
  const isLast = state.qIndex >= items.length-1;
  nextRow.innerHTML = `<button class="btn btn-primary" id="nextBtn">${isLast? "See results →" : "Next word →"}</button>`;
  document.getElementById("nextBtn").onclick = ()=>{
    if(isLast){ state.screen="summary"; }
    else{ state.qIndex++; state.options=[]; buildQuestion(); state.screen="practice"; }
    render();
  };
}

render();
</script>
