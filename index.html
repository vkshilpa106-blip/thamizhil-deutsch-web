<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thamizhil Deutsch — Learn German in Tamil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E0;
    --bg2:#F3E8CE;
    --card:#FFFDF6;
    --ink:#3A2416;
    --ink-dim:#8A6F55;
    --maroon:#5C1400;
    --maroon-dim:#8C4A2E;
    --rust:#C5601F;
    --gold:#D4A017;
    --gold-soft:#E9C46A;
    --green:#2F7A3D;
    --wrong:#C0392B;
    --line: rgba(92,20,0,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(212,160,23,0.08), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(92,20,0,0.05), transparent 45%);
    color:var(--ink);
    font-family:'Work Sans', 'Noto Sans Tamil', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .ta{font-family:'Noto Sans Tamil','Work Sans',sans-serif;}
  h1,h2,h3,.display{font-family:'Fraunces','Noto Sans Tamil',serif;color:var(--maroon);}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;}
  #app{max-width:920px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- NAV ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 8px;max-width:920px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--maroon);letter-spacing:.2px;}
  .brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold);}
  .brand small{display:block;font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-dim);letter-spacing:1.5px;font-weight:400;text-transform:uppercase;margin-top:2px;}

  /* ---------- HERO ---------- */
  .hero{padding:44px 0 40px;text-align:center;}
  .hero-logo{width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 26px;box-shadow:0 0 0 5px var(--card), 0 0 0 8px var(--gold), 0 14px 34px rgba(92,20,0,0.18);}
  .eyebrow{
    font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--rust);margin-bottom:16px;font-weight:700;
  }
  .hero h1{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.1;margin:0 0 26px;font-weight:600;}
  .hero h1 .accent{color:var(--rust);font-style:italic;}

  /* split-flap board */
  .flapboard{
    display:inline-flex;gap:10px;align-items:stretch;margin:0 auto 30px;
    background:var(--card);border:1.5px solid var(--gold-soft);border-radius:16px;padding:18px 26px;
    box-shadow:0 8px 24px rgba(92,20,0,0.08);
  }
  .flap-col{display:flex;flex-direction:column;align-items:center;min-width:110px;}
  .flap-lang{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--ink-dim);margin-bottom:8px;text-transform:uppercase;}
  .flap-word{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;min-height:1.4em;color:var(--maroon);
    transition:opacity .25s ease, transform .25s ease;
  }
  .flap-word.ta{font-size:1.35rem;}
  .flap-fade{opacity:0;transform:translateY(6px);}
  .flap-div{width:1px;background:var(--line);margin:4px 0;}

  .hero-sub{color:var(--ink-dim);font-size:1.02rem;max-width:480px;margin:0 auto 34px;line-height:1.6;}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    padding:14px 30px;border-radius:100px;font-weight:600;font-size:.98rem;
    transition:transform .15s ease, box-shadow .15s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--maroon);color:var(--card);box-shadow:0 6px 20px rgba(92,20,0,.28);}
  .btn-primary:hover{box-shadow:0 8px 26px rgba(92,20,0,.4);}
  .btn-ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon-dim);}
  .btn-ghost:hover{border-color:var(--maroon);background:rgba(92,20,0,0.04);}

  .stats{display:flex;gap:38px;justify-content:center;margin-top:56px;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:1.9rem;color:var(--rust);}
  .stat span{font-size:.78rem;color:var(--ink-dim);letter-spacing:.4px;}

  /* ---------- SECTION HEADERS ---------- */
  .section-head{margin:60px 0 26px;text-align:center;}
  .section-head h2{font-size:1.7rem;margin:0 0 8px;}
  .section-head p{color:var(--ink-dim);font-size:.94rem;margin:0;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:.88rem;
    margin-bottom:22px;background:none;padding:0;
  }
  .back-btn:hover{color:var(--maroon);}

  /* ---------- LEVEL STAIRCASE ---------- */
  .staircase{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
  .level-card{
    display:flex;align-items:center;gap:18px;background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:18px 22px;text-align:left;transition:transform .15s ease, border-color .15s ease;
    width:100%;box-shadow:0 3px 10px rgba(92,20,0,0.05);
  }
  .level-card:hover{transform:translateX(6px);border-color:var(--gold);}
  .level-code{
    font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;background:var(--bg2);
    color:var(--rust);padding:10px 14px;border-radius:10px;min-width:64px;text-align:center;
  }
  .level-info{flex:1;}
  .level-info h3{margin:0 0 4px;font-size:1.1rem;}
  .level-info span{font-size:.82rem;color:var(--ink-dim);}
  .level-progress{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--green);}
  .staircase .level-card:nth-child(1){margin-left:0;}
  .staircase .level-card:nth-child(2){margin-left:10px;}
  .staircase .level-card:nth-child(3){margin-left:20px;}
  .staircase .level-card:nth-child(4){margin-left:30px;}
  .staircase .level-card:nth-child(5){margin-left:40px;}
  .staircase .level-card:nth-child(6){margin-left:50px;}
  .staircase .level-card:nth-child(7){margin-left:60px;}
  .staircase .level-card:nth-child(8){margin-left:70px;}
  @media(max-width:600px){
    .staircase .level-card{margin-left:0 !important;}
  }

  /* ---------- TOPICS ---------- */
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .topic-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px;text-align:left;
    transition:transform .15s ease,border-color .15s ease;box-shadow:0 3px 10px rgba(92,20,0,0.05);
  }
  .topic-card:hover{transform:translateY(-3px);border-color:var(--green);}
  .topic-card h3{margin:0 0 6px;font-size:1.02rem;color:var(--maroon);}
  .topic-card span{font-size:.8rem;color:var(--ink-dim);}

  /* ---------- PRACTICE ---------- */
  .practice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:14px;}
  .progress-track{flex:1;height:8px;background:var(--bg2);border-radius:100px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:100px;transition:width .35s ease;}
  .streak-pill{
    display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--gold-soft);padding:6px 12px;border-radius:100px;
    font-family:'Space Mono',monospace;font-size:.8rem;color:var(--rust);white-space:nowrap;
  }

  .flashcard{
    background:var(--card);border:1.5px solid var(--gold-soft);border-radius:22px;padding:44px 30px;
    text-align:center;margin-bottom:26px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(92,20,0,0.08);
  }
  .card-tag{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;}
  .card-ta{font-size:1.9rem;margin:0 0 6px;font-weight:600;color:var(--maroon);}
  .card-en{color:var(--ink-dim);font-size:.95rem;margin-bottom:6px;}
  .prompt-line{font-size:1.02rem;color:var(--ink-dim);margin-top:18px;}

  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.options-grid{grid-template-columns:1fr;}}
  .opt-btn{
    background:var(--bg2);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;
    padding:16px;font-size:1.05rem;font-weight:600;transition:all .15s ease;text-align:center;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--gold);}
  .opt-btn.correct{background:rgba(47,122,61,.14);border-color:var(--green);color:var(--green);}
  .opt-btn.wrong{background:rgba(192,57,43,.14);border-color:var(--wrong);color:var(--wrong);animation:shake .35s ease;}
  .opt-btn:disabled{cursor:default;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .feedback-banner{
    text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:18px;padding:12px;border-radius:12px;
    opacity:0;transform:translateY(-6px);transition:all .25s ease;
  }
  .feedback-banner.show{opacity:1;transform:translateY(0);}
  .feedback-banner.correct{background:rgba(47,122,61,.12);color:var(--green);}
  .feedback-banner.wrong{background:rgba(192,57,43,.12);color:var(--wrong);}

  .next-row{text-align:center;margin-top:20px;}

  /* ---------- SUMMARY ---------- */
  .summary-card{text-align:center;padding:60px 20px;}
  .summary-emoji{font-size:3.4rem;margin-bottom:10px;}
  .summary-card h2{font-size:2rem;margin:0 0 10px;}
  .summary-score{font-family:'Space Mono',monospace;font-size:1.3rem;color:var(--rust);margin-bottom:30px;}

  /* confetti */
  .confetti{position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:999;}

  footer{text-align:center;color:var(--ink-dim);font-size:.8rem;margin-top:80px;padding-top:30px;border-top:1px solid var(--line);}
</style>
</head>

/* ============ SPEECH (Hören) ============ */
function speakGerman(text){
  if(!("speechSynthesis" in window)){
    alert("Your browser doesn't support built-in speech. Try Chrome or Edge for Hören practice.");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "de-DE";
  utter.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const deVoice = voices.find(v=>v.lang && v.lang.startsWith("de"));
  if(deVoice) utter.voice = deVoice;
  window.speechSynthesis.speak(utter);
}
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}

  return n;
}

/* ============ STORAGE ============ */
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem("td_progress")||"{}"); }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem("td_progress", JSON.stringify(p)); }
function loadStreak(){
  try{ return JSON.parse(localStorage.getItem("td_streak")||'{"count":0,"last":null}'); }catch(e){ return {count:0,last:null}; }
}
function bumpStreak(){
  const s = loadStreak();
  const today = new Date().toDateString();
  if(s.last === today) return s.count;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  s.count = (s.last === yesterday) ? s.count+1 : 1;
  s.last = today;
  localStorage.setItem("td_streak", JSON.stringify(s));
  return s.count;
}

let flapTimer=null;
function startFlap(){
  if(flapTimer) clearInterval(flapTimer);
  let i=0;
  const deEl=document.getElementById("flap-de"), taEl=document.getElementById("flap-ta"), enEl=document.getElementById("flap-en");
  if(!deEl) return;
  flapTimer = setInterval(()=>{
    i=(i+1)%FEATURED.length;
    [deEl,taEl,enEl].forEach(el=>el.classList.add("flap-fade"));
    setTimeout(()=>{
      deEl.textContent = FEATURED[i].de;
      taEl.textContent = FEATURED[i].ta;
      enEl.textContent = FEATURED[i].en;
      [deEl,taEl,enEl].forEach(el=>el.classList.remove("flap-fade"));
    },250);
  },2400);
}

/* ============ LEVELS ============ */
function renderLevels(){
  const progress = loadProgress();
  const rows = LEVEL_ORDER.map(lvl=>{
    const topics = DATA[lvl].topics;
    const topicCount = Object.keys(topics).length;
    const wordCount = Object.values(topics).reduce((a,t)=>a+t.items.length,0);
    const done = progress[lvl] ? Object.keys(progress[lvl]).length : 0;
    return `
    <button class="level-card" data-level="${lvl}">
      <div class="level-code">${lvl}</div>
      <div class="level-info">
        <h3>${DATA[lvl].label}</h3>
        <span>${topicCount} topics · ${wordCount} words</span>
      </div>
      <div class="level-progress">${done}/${topicCount} done</div>
    </button>`;
  }).join("");
  return `
  <button class="back-btn" data-nav="landing">← Home</button>
  <div class="section-head"><h2>Pick your level</h2><p>Climb from your first "Hallo" to real debates.</p></div>
  <div class="staircase">${rows}</div>
  `;
}

/* ============ MODE SELECT ============ */
function renderModes(){
  const lvl = state.level;

  const wordCount = Object.values(topics).reduce((a,t)=>a+t.items.length,0);

function renderTopics(){
  const lvl = state.level;
  const topics = DATA[lvl].topics;
  const progress = loadProgress();
  const modeLabel = state.mode==="hoeren" ? " · Hören" : "";
  const cards = Object.keys(topics).map(tk=>{
    const t = topics[tk];
    const progKey = state.mode==="hoeren" ? "hoeren_"+tk : tk;
    const best = progress[lvl] && progress[lvl][progKey] ? progress[lvl][progKey] : null;
    return `
    <button class="topic-card" data-topic="${tk}">
      <h3>${t.label.replace(/^Vocabulary: /,"")}</h3>
      <span>${t.items.length} words${best? " · best "+best+"%":""}</span>
    </button>`;
  }).join("");
  return `
  <button class="back-btn" data-nav="modes">← ${lvl} modes</button>
  <div class="section-head"><h2>${lvl} — ${DATA[lvl].label}${modeLabel}</h2><p>Choose a topic to practice.</p></div>
  <div class="topic-grid">${cards}</div>
  `;
}

/* ============ PRACTICE ============ */
function buildQuestion(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const correct = items[state.qIndex];
  let pool = items.filter(it=>it.id!==correct.id).slice();
  pool.sort(()=>Math.random()-0.5);
  const distractors = pool.slice(0,3);
  const options = [correct,...distractors].sort(()=>Math.random()-0.5);
  state.options = options;
  state.locked = false;
}

function renderPractice(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  if(state.qIndex===0 && state.options.length===0) buildQuestion();
  const current = items[state.qIndex];
  const pct = Math.round((state.qIndex)/items.length*100);
  const streak = loadStreak().count;

  const optsHtml = state.options.map(opt=>{
    return `<button class="opt-btn" data-optid="${opt.id}">${opt.de}</button>`;
  }).join("");

  return `
  <button class="back-btn" data-nav="topics">← Exit topic</button>
  <div class="practice-header">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="streak-pill">🔥 ${streak}</div>
  </div>
  <div id="feedback" class="feedback-banner"></div>
  <div class="flashcard">
    <div class="card-tag">${topic.label}</div>
    <div class="card-ta ta">${current.ta}</div>
    <div class="card-en">${current.en||""}</div>
    <div class="prompt-line">Which German word matches this?</div>
  </div>
  <div class="options-grid">${optsHtml}</div>
  <div class="next-row" id="nextRow"></div>
  `;
}

/* ============ HÖREN (LISTENING) PRACTICE ============ */
function buildHoerenQuestion(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const correct = items[state.qIndex];
  let pool = items.filter(it=>it.id!==correct.id).slice();
  pool.sort(()=>Math.random()-0.5);
  const distractors = pool.slice(0,3);
  const options = [correct,...distractors].sort(()=>Math.random()-0.5);
  state.options = options;
  state.locked = false;
}

function renderHoerenPractice(){
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  if(state.qIndex===0 && state.options.length===0) buildHoerenQuestion();
  const current = items[state.qIndex];
  const pct = Math.round((state.qIndex)/items.length*100);
  const streak = loadStreak().count;

  const optsHtml = state.options.map(opt=>{
    return `<button class="opt-btn" data-hoptid="${opt.id}">${opt.ta}</button>`;
  }).join("");

  return `
  <button class="back-btn" data-nav="topics">← Exit topic</button>
  <div class="practice-header">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

  </div>
  <div id="feedback" class="feedback-banner"></div>
  <div class="flashcard">
    <div class="card-tag">${topic.label} · Hören</div>
    <button class="btn btn-primary" id="speakBtn">🔊 Play word</button>
    <div class="prompt-line" style="margin-top:22px;">Listen carefully — which meaning matches what you heard?</div>
  </div>
  <div class="options-grid">${optsHtml}</div>
  <div class="next-row" id="nextRow"></div>
  `;
}

function handleHoerenAnswer(btnEl){
  if(state.locked) return;
  state.locked = true;
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const current = items[state.qIndex];
  const chosenId = btnEl.getAttribute("data-hoptid");
  const isCorrect = chosenId === current.id;
  const feedback = document.getElementById("feedback");

  document.querySelectorAll("[data-hoptid]").forEach(b=>{
    b.disabled = true;
    if(b.getAttribute("data-hoptid")===current.id) b.classList.add("correct");
    if(b===btnEl && !isCorrect) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    bumpStreak();
    feedback.textContent = "🟩 Correct-u! Super da";
    feedback.className = "feedback-banner correct show";
    burstConfetti();
  }else{
    feedback.textContent = `🟥 Wrong-u. That was: ${current.de} (${current.ta})`;
    feedback.className = "feedback-banner wrong show";
  }

  const nextRow = document.getElementById("nextRow");
  const isLast = state.qIndex >= items.length-1;
  nextRow.innerHTML = `<button class="btn btn-primary" id="nextBtn">${isLast? "See results →" : "Next word →"}</button>`;
  document.getElementById("nextBtn").onclick = ()=>{
    if(isLast){ state.screen="summary"; }
    else{ state.qIndex++; state.options=[]; buildHoerenQuestion(); state.screen="hoerenPractice"; }
    render();
  };
}

/* ============ LESEN (READING) ============ */
function renderPassages(){
  const lvl = state.level;
  const passages = READING_DATA[lvl] || [];
  const progress = loadProgress();
  const cards = passages.map((p,i)=>{
    const best = progress[lvl] && progress[lvl]["lesen_"+i] ? progress[lvl]["lesen_"+i] : null;
    return `
    <button class="topic-card" data-passage="${i}">
      <h3>📖 ${p.title}</h3>
      <span>${p.questions.length} questions${best? " · best "+best+"%":""}</span>
    </button>`;
  }).join("");
  return `
  <button class="back-btn" data-nav="modes">← ${lvl} modes</button>
  <div class="section-head"><h2>${lvl} — Lesen</h2><p>Pick a short passage to read.</p></div>
  <div class="topic-grid">${cards}</div>
  `;
}

function renderReading(){
  const p = READING_DATA[state.level][state.passageIndex];
  if(state.passageStep==="read"){
    return `
    <button class="back-btn" data-nav="passages">← Passages</button>
    <div class="flashcard" style="text-align:left;">
      <div class="card-tag" style="text-align:center;">${p.title}</div>
      <p style="font-size:1.15rem;line-height:1.8;color:var(--ink);">${p.text}</p>
      <div style="text-align:center;margin-top:14px;">
        <button class="btn btn-ghost" id="speakPassageBtn">🔊 Listen to passage</button>
      </div>
    </div>
    <div class="next-row"><button class="btn btn-primary" id="readingContinueBtn">Answer questions →</button></div>
    `;
  }
  // questions step
  const q = p.questions[state.qIndex];
  const pct = Math.round((state.qIndex)/p.questions.length*100);
  const optsHtml = q.options.map(opt=>`<button class="opt-btn" data-ropt="${opt.replace(/"/g,'&quot;')}">${opt}</button>`).join("");
  return `
  <button class="back-btn" data-nav="passages">← Passages</button>
  <div class="practice-header">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div id="feedback" class="feedback-banner"></div>
  <div class="flashcard">
    <div class="card-tag">${p.title}</div>
    <div class="prompt-line" style="margin-top:0;font-size:1.1rem;color:var(--ink);">${q.q}</div>
  </div>
  <div class="options-grid" id="readingOpts">${optsHtml}</div>
  <div class="next-row" id="nextRow"></div>
  `;
}


function renderSummary(){
  const total = state.mode==="lesen"
    ? READING_DATA[state.level][state.passageIndex].questions.length
    : DATA[state.level].topics[state.topicKey].items.length;
  const pct = Math.round((state.score/total)*100);
  const emoji = pct>=80 ? "🎉" : pct>=50 ? "🌟" : "💪";
  const msg = pct>=80 ? "Super da! Excellent work." : pct>=50 ? "Nalla progress! Keep going." : "Konjo practice pannunga — you'll get there.";

  const progress = loadProgress();
  if(!progress[state.level]) progress[state.level] = {};
  const progKey = state.mode==="hoeren" ? "hoeren_"+state.topicKey
                : state.mode==="lesen" ? "lesen_"+state.passageIndex
                : state.topicKey;
  const prevBest = progress[state.level][progKey] || 0;
  progress[state.level][progKey] = Math.max(prevBest, pct);
  saveProgress(progress);

  const backNav = state.mode==="lesen" ? "passages" : "topics";
  const backLabel = state.mode==="lesen" ? "Other passages" : "Other topics";

  return `
  <div class="flashcard summary-card">
    <div class="summary-emoji">${emoji}</div>
    <h2>${msg}</h2>
    <div class="summary-score mono">${state.score} / ${total} correct — ${pct}%</div>
    <div class="cta-row">
      <button class="btn btn-primary" data-action="retry">Try again</button>
      <button class="btn btn-ghost" data-nav="${backNav}">${backLabel}</button>
    </div>
  </div>
  `;
}

/* ============ CONFETTI ============ */
function burstConfetti(){
  const colors=["#E4A83B","#C1453F","#2E9B82","#7B8AE8"];
  const supportsAnimate = typeof Element!=="undefined" && typeof Element.prototype.animate==="function";
  for(let i=0;i<24;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left = (45+Math.random()*10)+"vw";
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d);
    const dx=(Math.random()-0.5)*300, dur=700+Math.random()*500;
    if(supportsAnimate){
      try{
        d.animate([
          {transform:`translate(0,0) rotate(0deg)`, opacity:1},
          {transform:`translate(${dx}px, 70vh) rotate(720deg)`, opacity:0}
        ],{duration:dur, easing:"cubic-bezier(.2,.6,.3,1)"});
      }catch(e){ /* animation unsupported in this environment, confetti just won't move */ }
    }else{
      /* fallback: simple CSS transition instead of the Web Animations API */
      d.style.transition = `transform ${dur}ms cubic-bezier(.2,.6,.3,1), opacity ${dur}ms ease`;
      requestAnimationFrame(()=>{
        d.style.transform = `translate(${dx}px, 70vh) rotate(720deg)`;
        d.style.opacity = "0";
      });
    }
    setTimeout(()=>d.remove(), dur+50);
  }
}

/* ============ EVENTS ============ */
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = ()=>{
      const nav = el.getAttribute("data-nav");
      state.screen = nav;
      render();
    };
  });
  document.querySelectorAll("[data-level]").forEach(el=>{
    el.onclick = ()=>{ state.level=el.getAttribute("data-level"); state.screen="modes"; render(); };
  });
  document.querySelectorAll("[data-modeselect]").forEach(el=>{
    el.onclick = ()=>{
      const mode = el.getAttribute("data-modeselect");
      state.mode = mode;
      if(mode==="vocab"){ state.screen="topics"; }
      else if(mode==="hoeren"){
        if(!("speechSynthesis" in window)) return;
        state.screen="topics";
      }
      else if(mode==="lesen"){
        const passages = READING_DATA[state.level]||[];
        if(passages.length===0) return;
        state.screen="passages";
      }
      render();
    };
  });
  document.querySelectorAll("[data-topic]").forEach(el=>{
    el.onclick = ()=>{
      state.topicKey = el.getAttribute("data-topic");
      state.qIndex=0; state.score=0; state.options=[];
      state.screen = (state.mode==="hoeren") ? "hoerenPractice" : "practice";
      render();
    };
  });
  document.querySelectorAll("[data-optid]").forEach(el=>{
    el.onclick = ()=>handleAnswer(el);
  });
  document.querySelectorAll("[data-hoptid]").forEach(el=>{
    el.onclick = ()=>handleHoerenAnswer(el);
  });
  document.querySelectorAll("[data-passage]").forEach(el=>{
    el.onclick = ()=>{
      state.passageIndex = parseInt(el.getAttribute("data-passage"),10);
      state.passageStep = "read"; state.qIndex=0; state.score=0; state.locked=false;
      state.screen="reading"; render();
    };
  });
  const speakBtn = document.getElementById("speakBtn");
  if(speakBtn) speakBtn.onclick = ()=>{
    const topic = DATA[state.level].topics[state.topicKey];
    speakGerman(topic.items[state.qIndex].de);
  };
  const speakPassageBtn = document.getElementById("speakPassageBtn");
  if(speakPassageBtn) speakPassageBtn.onclick = ()=>{
    const p = READING_DATA[state.level][state.passageIndex];
    speakGerman(p.text);
  };
  const readingContinueBtn = document.getElementById("readingContinueBtn");
  if(readingContinueBtn) readingContinueBtn.onclick = ()=>{
    state.passageStep="questions"; state.qIndex=0; state.locked=false; render();
  };
  document.querySelectorAll("[data-ropt]").forEach(el=>{
    el.onclick = ()=>handleReadingAnswer(el);
  });
  const retryBtn = document.querySelector('[data-action="retry"]');
  if(retryBtn) retryBtn.onclick = ()=>{
    state.qIndex=0; state.score=0; state.options=[];
    if(state.mode==="lesen"){ state.passageStep="read"; state.screen="reading"; }
    else{ state.screen = (state.mode==="hoeren") ? "hoerenPractice" : "practice"; }
    render();
  };
  const retryReadingBtn = document.querySelector('[data-action="retryReading"]');
  if(retryReadingBtn) retryReadingBtn.onclick = ()=>{
    state.passageStep="read"; state.qIndex=0; state.score=0; state.screen="reading"; render();
  };
}

function handleReadingAnswer(btnEl){
  if(state.locked) return;
  state.locked = true;
  const p = READING_DATA[state.level][state.passageIndex];
  const q = p.questions[state.qIndex];
  const chosen = btnEl.getAttribute("data-ropt");
  const isCorrect = chosen === q.correct;
  const feedback = document.getElementById("feedback");

  document.querySelectorAll("[data-ropt]").forEach(b=>{
    b.disabled = true;
    if(b.getAttribute("data-ropt")===q.correct) b.classList.add("correct");
    if(b===btnEl && !isCorrect) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    bumpStreak();
    feedback.textContent = "🟩 Correct-u! Super da";
    feedback.className = "feedback-banner correct show";
    burstConfetti();
  }else{
    feedback.textContent = `🟥 Wrong-u. Correct answer: ${q.correct}`;
    feedback.className = "feedback-banner wrong show";
  }

  const nextRow = document.getElementById("nextRow");
  const isLast = state.qIndex >= p.questions.length-1;
  nextRow.innerHTML = `<button class="btn btn-primary" id="nextBtn">${isLast? "See results →" : "Next question →"}</button>`;
  document.getElementById("nextBtn").onclick = ()=>{
    if(isLast){ state.screen="summary"; }
    else{ state.qIndex++; state.locked=false; state.screen="reading"; }
    render();
  };
}

function handleAnswer(btnEl){
  if(state.locked) return;
  state.locked = true;
  const topic = DATA[state.level].topics[state.topicKey];
  const items = topic.items;
  const current = items[state.qIndex];
  const chosenId = btnEl.getAttribute("data-optid");
  const isCorrect = chosenId === current.id;
  const feedback = document.getElementById("feedback");

  document.querySelectorAll(".opt-btn").forEach(b=>{
    b.disabled = true;
    if(b.getAttribute("data-optid")===current.id) b.classList.add("correct");
    if(b===btnEl && !isCorrect) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    bumpStreak();
    feedback.textContent = "🟩 Correct-u! Super da";
    feedback.className = "feedback-banner correct show";
    burstConfetti();
  }else{
    feedback.textContent = `🟥 Wrong-u. Correct word: ${current.de}`;
    feedback.className = "feedback-banner wrong show";
  }

  const nextRow = document.getElementById("nextRow");
  const isLast = state.qIndex >= items.length-1;
  nextRow.innerHTML = `<button class="btn btn-primary" id="nextBtn">${isLast? "See results →" : "Next word →"}</button>`;
  document.getElementById("nextBtn").onclick = ()=>{
    if(isLast){ state.screen="summary"; }
    else{ state.qIndex++; state.options=[]; buildQuestion(); state.screen="practice"; }
    render();
  };
}

render();
</script>
</body>
</html>
